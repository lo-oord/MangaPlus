plugins {
    id "com.android.application"
    id 'org.jetbrains.kotlin.android'
    id "com.google.gms.google-services"
    id "dev.flutter.flutter-gradle-plugin"
}


android {
    namespace 'com.mangaplus.app'
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "com.mangaplus.app"
        minSdkVersion flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    signingConfigs {
        // Only wire the release keystore when the signing secrets are present,
        // otherwise Gradle fails during configuration even for debug builds.
        def keystorePath = System.getenv("KEYSTORE_PATH")
        if (keystorePath) {
            release {
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
                storeFile file(keystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.findByName("release") ?: signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation "com.google.android.material:material:1.12.0"
    implementation "org.brotli:dec:0.1.2"
}
