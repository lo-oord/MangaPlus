name: Android Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: stable
          cache: true
      - name: Decode release signing key
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/mangaplus-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/mangaplus-release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze changed Dart code
        run: >-
          flutter analyze --no-pub
          lib/main.dart
          lib/app/data/services/chapter_update_service.dart
          lib/app/modules/profile/controllers/profile_controller.dart
      - name: Run tests
        run: flutter test --no-pub
      - name: Build signed release APK from pubspec version
        run: flutter build apk --release
      - name: Verify release signing certificate
        shell: bash
        run: |
          set -euo pipefail
          actual="$(keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | awk '/SHA256:/ {print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          expected="252BD865EC82DC2CD236D46EA98B1BBFA778F4538DD53603265B68972F236AA3"
          if [[ "$actual" != "$expected" ]]; then
            echo "Signing certificate mismatch; refusing to publish."
            exit 1
          fi
          echo "Verified release signing certificate: $actual"
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaPlus-android-release-1.1.0
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
