
name: Android Release APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    if: github.ref_type != 'tag' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: stable
          cache: true

      - name: Decode release signing key
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/mangaplus-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/mangaplus-release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze changed Dart code
        run: |
          flutter analyze --no-pub \
            lib/main.dart \
            lib/app/data/services/comic_service.dart \
            lib/app/data/services/chapter_update_service.dart \
            lib/app/modules/profile/controllers/profile_controller.dart \
            lib/app/modules/chapter/controllers/chapter_controller.dart \
            lib/app/modules/chapter/views/chapter_view.dart \
            lib/app/core/utils/reader_progress.dart \
            lib/app/core/translations/ar_sa.dart \
            lib/app/core/translations/en_us.dart \
            lib/app/data/sources/dilar_source.dart \
            lib/app/data/sources/manga_source_registry.dart \
            lib/app/data/sources/source_brand.dart \
            test/home_source_selection_test.dart \
            test/manga_swat_source_test.dart \
            test/lava_scans_source_test.dart \
            test/mknov_source_test.dart \
            test/cenele_source_test.dart \
            test/mangadar_source_test.dart \
            test/dilar_source_test.dart \
            test/seanovel_source_test.dart \
            test/reader_progress_test.dart

      - name: Run tests
        run: flutter test --no-pub

      - name: Build APKs
        run: |
          set -euo pipefail

          flutter build apk --release --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk MangaPlus-arm64-v8a.apk

          flutter build apk --release --target-platform android-arm
          cp build/app/outputs/flutter-apk/app-release.apk MangaPlus-armeabi-v7a.apk

          flutter build apk --release --target-platform android-arm,android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk MangaPlus-universal.apk

      - name: Verify APK signing certificates
        shell: bash
        run: |
          set -euo pipefail
          expected="252BD865EC82DC2CD236D46EA98B1BBFA778F4538DD53603265B68972F236AA3"

          for apk in MangaPlus-arm64-v8a.apk MangaPlus-armeabi-v7a.apk MangaPlus-universal.apk; do
            actual="$(keytool -printcert -jarfile "$apk" | awk '/SHA256:/ {print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"

            if [[ "$actual" != "$expected" ]]; then
              echo "Signing certificate mismatch: $apk"
              exit 1
            fi

            echo "Verified: $apk"
          done

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: MangaPlus-arm64-v8a
          path: MangaPlus-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload ARM32 APK
        uses: actions/upload-artifact@v4
        with:
          name: MangaPlus-armeabi-v7a
          path: MangaPlus-armeabi-v7a.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: MangaPlus-universal
          path: MangaPlus-universal.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MangaPlus 1.1
          generate_release_notes: true
          files: |
            MangaPlus-arm64-v8a.apk
            MangaPlus-armeabi-v7a.apk
            MangaPlus-universal.apk
