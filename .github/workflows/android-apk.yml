name: Android APK (release signing)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: stable
          cache: true
      - name: Decode release signing key
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/mangaplus-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/mangaplus-release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze changed Dart code
        run: >-
          flutter analyze --no-pub
          lib/main.dart
          lib/app/core/translations/ar_SA.dart
          lib/app/core/translations/en_US.dart
          lib/app/data/services/app_notification_service.dart
          lib/app/data/services/chapter_update_coordinator.dart
          lib/app/data/services/chapter_update_service.dart
          lib/app/data/services/notification_permission_prompt.dart
          lib/app/data/services/reading_stats_service.dart
          lib/app/data/models/reading_stats.dart
          lib/app/modules/auth/controllers/auth_controller.dart
          lib/app/modules/chapter/controllers/chapter_controller.dart
          lib/app/modules/chapter/views/chapter_view.dart
          lib/app/modules/main/bindings/main_binding.dart
          lib/app/modules/notifications/controllers/notifications_controller.dart
          lib/app/modules/notifications/views/notifications_view.dart
          lib/app/modules/profile/bindings/profile_binding.dart
          lib/app/modules/profile/controllers/reading_stats_controller.dart
          lib/app/modules/profile/controllers/profile_controller.dart
          lib/app/modules/profile/views/profile_view.dart
          lib/app/modules/profile/views/reading_stats_panel.dart
          test/reading_stats_test.dart
      - name: Run tests
        run: flutter test --no-pub
      - name: Build one signed release APK
        run: flutter build apk --release --build-name=1.0.0 --build-number=${{ github.run_number }}
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaPlus-android-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
